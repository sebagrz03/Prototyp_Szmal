<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Control – Prototyp_Szmal</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    body { padding-bottom: 40px; }
    .card { margin: 12px; padding: 16px; }
    h1 { font-size: 18px; }
  </style>
</head>
<body>
  <header>
    <h1>Prototyp_Szmal – Mobile Panel</h1>
  </header>
  <main>
    <div class="card">
      <h2 style="font-size:16px;">Run pipeline</h2>
      <label>
        Niche
        <input id="niche" value="AI, glitch memes, NPC behaviour" />
      </label>
      <br /><br />
      <button id="runBtn">Run</button>
      <p id="status"></p>
      <pre id="log" style="max-height:220px; overflow:auto;"></pre>
    </div>
  </main>
  <script>
    const runBtn = document.getElementById("runBtn");
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");

    runBtn.onclick = async () => {
      runBtn.disabled = true;
      statusEl.textContent = "Running...";
      logEl.textContent = "";
      try {
        const niche = document.getElementById("niche").value;
        const resp = await fetch("/api/autopublish/run-once", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ niche })
        });
        const json = await resp.json();
        statusEl.textContent = json.ok ? "Done" : "Error";
        logEl.textContent = JSON.stringify({
          ok: json.ok,
          finalVideoPath: json.finalVideoPath,
          title: json.meta?.title,
          hashtags: json.meta?.hashtags
        }, null, 2);
      } catch (e) {
        statusEl.textContent = "Error";
        logEl.textContent = String(e);
      } finally {
        runBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
