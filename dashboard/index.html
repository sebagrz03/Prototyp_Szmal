<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sora Test – Prototyp_Szmal</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>Sora Test – Surreal Micro Sketch</h1>
  </header>
  <main>
    <div class="card">
      <h2>Quick Sora Test Clip</h2>
      <p>Generate a single 8s surreal / glitchy test clip to verify your Sora + OpenAI setup.</p>
      <label>
        Prompt
        <textarea id="prompt" rows="4">A glitchy office where every time the worker blinks, the room changes style.</textarea>
      </label>
      <br /><br />
      <button id="runBtn">Generate test clip</button>
      <p id="status"></p>
      <pre id="log"></pre>
    </div>
  </main>
  <script>
    const runBtn = document.getElementById("runBtn");
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");

    runBtn.onclick = async () => {
      runBtn.disabled = true;
      statusEl.textContent = "Running...";
      logEl.textContent = "";
      try {
        const prompt = document.getElementById("prompt").value;
        const resp = await fetch("/api/video/sora-test", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });
        const json = await resp.json();
        statusEl.textContent = json.ok ? "Done" : "Error";
        logEl.textContent = JSON.stringify(json, null, 2);
      } catch (e) {
        statusEl.textContent = "Error";
        logEl.textContent = String(e);
      } finally {
        runBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
